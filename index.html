<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suno Music Player</title>
<meta name="description" content="Sunoで制作した楽曲をループ再生できるミュージックプレイヤー">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a22;
    --surface-2: #1e242f;
    --text: #eef1f6;
    --text-dim: #8b93a3;
    --accent: #7c8cff;
    --accent-2: #b07cff;
    --danger: #ff7c8c;
    --radius: 16px;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI",
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(124, 140, 255, 0.14), transparent 60%),
      radial-gradient(900px 500px at -10% 100%, rgba(176, 124, 255, 0.10), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 20px 140px;
  }
  header.site {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  header.site h1 {
    font-size: clamp(1.4rem, 3.5vw, 1.9rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header.site p { color: var(--text-dim); font-size: 0.85rem; }

  /* ===== Now playing card ===== */
  .now-playing {
    display: flex;
    gap: 24px;
    align-items: center;
    background: linear-gradient(160deg, var(--surface-2), var(--surface));
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 24px;
  }
  .artwork {
    width: 168px;
    height: 168px;
    flex: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #2a3040, #1a1e28);
    background-size: cover;
    background-position: center;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    display: grid;
    place-items: center;
    font-size: 3rem;
    transition: transform 0.4s ease;
  }
  .playing .artwork { animation: float 6s ease-in-out infinite; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .np-info { min-width: 0; flex: 1; }
  .np-label {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .np-title {
    font-size: clamp(1.15rem, 3vw, 1.5rem);
    font-weight: 700;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .np-sub { margin-top: 6px; font-size: 0.85rem; color: var(--text-dim); }
  .np-sub a { color: var(--text-dim); }
  .np-sub a:hover { color: var(--accent); }

  /* ===== Player bar ===== */
  .player {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(18, 21, 28, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  .player-inner { max-width: 960px; margin: 0 auto; }
  .seek-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .time { font-variant-numeric: tabular-nums; font-size: 0.75rem; color: var(--text-dim); width: 42px; }
  .time.right { text-align: right; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 5px;
    border-radius: 3px;
    background: linear-gradient(to right, var(--accent) var(--fill, 0%), #333a48 var(--fill, 0%));
    cursor: pointer;
    outline-offset: 4px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    transition: transform 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border: none;
    border-radius: 50%;
    background: #fff;
  }
  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .transport { display: flex; align-items: center; gap: 8px; margin: 0 auto; }
  button.ctl {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    width: 44px; height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  button.ctl:hover { background: rgba(255, 255, 255, 0.08); }
  button.ctl:active { transform: scale(0.92); }
  button.ctl svg { width: 22px; height: 22px; fill: currentColor; }
  button.ctl.small svg { width: 18px; height: 18px; }
  button.ctl.play {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 4px 16px rgba(124, 140, 255, 0.4);
  }
  button.ctl.play:hover { filter: brightness(1.1); }
  button.ctl.play svg { width: 26px; height: 26px; }
  button.ctl.toggled { color: var(--accent); }
  button.ctl.toggled::after {
    content: "";
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
    transform: translateY(16px);
  }
  button.ctl { position: relative; }
  .badge {
    position: absolute;
    top: 4px; right: 4px;
    font-size: 0.55rem;
    font-weight: 700;
    color: var(--bg);
    background: var(--accent);
    border-radius: 6px;
    padding: 0 3px;
    line-height: 1.3;
  }
  .side { width: 130px; display: flex; align-items: center; gap: 8px; }
  .side.right { justify-content: flex-end; }
  .side .vol { height: 4px; }
  .side svg { width: 18px; height: 18px; fill: var(--text-dim); flex: none; }

  /* ===== Playlist ===== */
  .playlist-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 0 4px 10px;
  }
  .playlist-head h2 { font-size: 1rem; font-weight: 600; }
  .playlist-head span { color: var(--text-dim); font-size: 0.8rem; }
  ol.playlist { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .track {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--surface);
    border: 1px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .track:hover { background: var(--surface-2); }
  .track.active {
    background: linear-gradient(90deg, rgba(124, 140, 255, 0.16), rgba(176, 124, 255, 0.08));
    border-color: rgba(124, 140, 255, 0.35);
  }
  .track.failed { opacity: 0.45; cursor: not-allowed; }
  .track .num {
    width: 22px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    font-size: 0.85rem;
    flex: none;
  }
  .track .thumb {
    width: 42px; height: 42px;
    border-radius: 8px;
    background: linear-gradient(135deg, #2a3040, #1a1e28);
    background-size: cover;
    background-position: center;
    flex: none;
  }
  .track .t-title {
    flex: 1;
    min-width: 0;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track.active .t-title { color: var(--accent); font-weight: 600; }
  .track .t-dur { font-size: 0.78rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .track a.ext {
    color: var(--text-dim);
    display: grid;
    place-items: center;
    padding: 6px;
    border-radius: 8px;
  }
  .track a.ext:hover { color: var(--accent); background: rgba(255,255,255,0.06); }
  .track a.ext svg { width: 14px; height: 14px; fill: currentColor; }

  /* equalizer animation for active track */
  .eq { display: none; width: 16px; height: 14px; flex: none; align-items: flex-end; gap: 2px; }
  .track.active.playing-track .eq { display: flex; }
  .track.active.playing-track .num { display: none; }
  .eq span {
    width: 3px;
    background: var(--accent);
    border-radius: 1px;
    animation: eq 0.9s ease-in-out infinite;
  }
  .eq span:nth-child(2) { animation-delay: 0.25s; }
  .eq span:nth-child(3) { animation-delay: 0.5s; }
  @keyframes eq {
    0%, 100% { height: 4px; }
    50% { height: 14px; }
  }

  .notice {
    margin: 16px 0;
    padding: 12px 16px;
    border-radius: 10px;
    background: rgba(255, 124, 140, 0.1);
    border: 1px solid rgba(255, 124, 140, 0.3);
    color: var(--danger);
    font-size: 0.85rem;
    display: none;
  }
  .notice.show { display: block; }

  footer {
    margin-top: 40px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.75rem;
  }
  footer a { color: var(--text-dim); }

  @media (max-width: 600px) {
    .now-playing { flex-direction: column; text-align: center; padding: 20px; }
    .artwork { width: 200px; height: 200px; }
    .side { display: none; }
    .transport { gap: 4px; }
    .app { padding-bottom: 150px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="site">
    <h1 id="site-title">Suno Music Player</h1>
    <p>AI音楽制作 — Suno で作った楽曲集</p>
  </header>

  <section class="now-playing" id="np-card">
    <div class="artwork" id="np-art">🎵</div>
    <div class="np-info">
      <div class="np-label">Now Playing</div>
      <div class="np-title" id="np-title">読み込み中…</div>
      <div class="np-sub" id="np-sub"></div>
    </div>
  </section>

  <div class="notice" id="notice"></div>

  <div class="playlist-head">
    <h2>プレイリスト</h2>
    <span id="track-count"></span>
  </div>
  <ol class="playlist" id="playlist"></ol>

  <footer>
    <p>Music generated with <a href="https://suno.com" target="_blank" rel="noopener">Suno</a></p>
  </footer>
</div>

<div class="player">
  <div class="player-inner">
    <div class="seek-row">
      <span class="time" id="cur-time">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置">
      <span class="time right" id="dur-time">0:00</span>
    </div>
    <div class="controls-row">
      <div class="side"></div>
      <div class="transport">
        <button class="ctl small" id="btn-shuffle" title="シャッフル" aria-label="シャッフル">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.14L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="ctl" id="btn-prev" title="前の曲" aria-label="前の曲">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button class="ctl play" id="btn-play" title="再生 / 一時停止" aria-label="再生 / 一時停止">
          <svg viewBox="0 0 24 24" id="icon-play"><path d="M8 5v14l11-7L8 5z"/></svg>
          <svg viewBox="0 0 24 24" id="icon-pause" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctl" id="btn-next" title="次の曲" aria-label="次の曲">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="ctl small toggled" id="btn-repeat" title="リピート（全曲）" aria-label="リピート切り替え">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          <span class="badge" id="repeat-badge" style="display:none">1</span>
        </button>
      </div>
      <div class="side right">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg>
        <input type="range" class="vol" id="vol" min="0" max="100" value="80" aria-label="音量">
      </div>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(() => {
  "use strict";

  const audio = document.getElementById("audio");
  const els = {
    playlist: document.getElementById("playlist"),
    trackCount: document.getElementById("track-count"),
    npCard: document.getElementById("np-card"),
    npArt: document.getElementById("np-art"),
    npTitle: document.getElementById("np-title"),
    npSub: document.getElementById("np-sub"),
    notice: document.getElementById("notice"),
    seek: document.getElementById("seek"),
    curTime: document.getElementById("cur-time"),
    durTime: document.getElementById("dur-time"),
    vol: document.getElementById("vol"),
    btnPlay: document.getElementById("btn-play"),
    btnPrev: document.getElementById("btn-prev"),
    btnNext: document.getElementById("btn-next"),
    btnShuffle: document.getElementById("btn-shuffle"),
    btnRepeat: document.getElementById("btn-repeat"),
    repeatBadge: document.getElementById("repeat-badge"),
    iconPlay: document.getElementById("icon-play"),
    iconPause: document.getElementById("icon-pause"),
  };

  let tracks = [];
  let order = [];        // 再生順（シャッフル対応）
  let current = -1;      // tracks のインデックス
  let shuffle = false;
  let repeatMode = "all"; // "all" | "one" | "off"
  let seeking = false;

  const fmt = (s) => {
    if (!isFinite(s)) return "0:00";
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${String(sec).padStart(2, "0")}`;
  };

  function showNotice(msg) {
    els.notice.textContent = msg;
    els.notice.classList.add("show");
  }

  function buildOrder() {
    order = tracks.map((_, i) => i).filter((i) => !tracks[i].error);
    if (shuffle) {
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
    }
  }

  function renderPlaylist() {
    els.playlist.innerHTML = "";
    tracks.forEach((t, i) => {
      const li = document.createElement("li");
      li.className = "track" + (t.error ? " failed" : "");
      li.dataset.index = i;

      const num = document.createElement("span");
      num.className = "num";
      num.textContent = i + 1;

      const eq = document.createElement("span");
      eq.className = "eq";
      eq.innerHTML = "<span></span><span></span><span></span>";

      const thumb = document.createElement("span");
      thumb.className = "thumb";
      if (t.image) thumb.style.backgroundImage = `url("${t.image}")`;

      const title = document.createElement("span");
      title.className = "t-title";
      title.textContent = t.error ? `（取得失敗）${t.sourceUrl}` : t.title;

      const dur = document.createElement("span");
      dur.className = "t-dur";
      dur.dataset.dur = i;

      li.append(num, eq, thumb, title, dur);

      if (t.pageUrl || t.sourceUrl) {
        const a = document.createElement("a");
        a.className = "ext";
        a.href = t.pageUrl || t.sourceUrl;
        a.target = "_blank";
        a.rel = "noopener";
        a.title = "Sunoで開く";
        a.innerHTML =
          '<svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>';
        a.addEventListener("click", (e) => e.stopPropagation());
        li.appendChild(a);
      }

      if (!t.error) {
        li.addEventListener("click", () => playTrack(i));
      }
      els.playlist.appendChild(li);
    });
    const ok = tracks.filter((t) => !t.error).length;
    els.trackCount.textContent = `${ok} 曲`;
  }

  function updateActive() {
    document.querySelectorAll(".track").forEach((el) => {
      const i = Number(el.dataset.index);
      el.classList.toggle("active", i === current);
      el.classList.toggle("playing-track", i === current && !audio.paused);
    });
    document.body.classList.toggle("playing", !audio.paused && current >= 0);
  }

  function playTrack(i, autoplay = true) {
    const t = tracks[i];
    if (!t || t.error) return;
    current = i;
    audio.src = t.audio;
    els.npTitle.textContent = t.title;
    els.npArt.textContent = t.image ? "" : "🎵";
    els.npArt.style.backgroundImage = t.image ? `url("${t.image}")` : "";
    els.npSub.innerHTML = "";
    if (t.pageUrl || t.sourceUrl) {
      const link = document.createElement("a");
      link.href = t.pageUrl || t.sourceUrl;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "Suno で聴く ↗";
      els.npSub.appendChild(link);
    }
    document.title = `${t.title} — Suno Music Player`;

    if (autoplay) {
      audio.play().catch(() => {/* 自動再生ブロックはユーザー操作待ち */});
    }
    updateActive();
    updateMediaSession(t);
  }

  function step(dir) {
    if (!order.length) return;
    const pos = order.indexOf(current);
    let nextPos = pos + dir;
    if (nextPos >= order.length) {
      if (repeatMode === "off") { audio.pause(); return; }
      nextPos = 0;
      if (shuffle) buildOrder(); // 一周したらシャッフルし直す
    }
    if (nextPos < 0) nextPos = order.length - 1;
    playTrack(order[nextPos]);
  }

  // ===== イベント =====
  els.btnPlay.addEventListener("click", () => {
    if (current < 0) {
      if (order.length) playTrack(order[0]);
      return;
    }
    audio.paused ? audio.play() : audio.pause();
  });
  els.btnNext.addEventListener("click", () => step(1));
  els.btnPrev.addEventListener("click", () => {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    step(-1);
  });
  els.btnShuffle.addEventListener("click", () => {
    shuffle = !shuffle;
    els.btnShuffle.classList.toggle("toggled", shuffle);
    buildOrder();
  });
  els.btnRepeat.addEventListener("click", () => {
    repeatMode = repeatMode === "all" ? "one" : repeatMode === "one" ? "off" : "all";
    els.btnRepeat.classList.toggle("toggled", repeatMode !== "off");
    els.repeatBadge.style.display = repeatMode === "one" ? "" : "none";
    els.btnRepeat.title =
      repeatMode === "all" ? "リピート（全曲）" :
      repeatMode === "one" ? "リピート（1曲）" : "リピートなし";
  });

  audio.addEventListener("play", () => {
    els.iconPlay.style.display = "none";
    els.iconPause.style.display = "";
    updateActive();
  });
  audio.addEventListener("pause", () => {
    els.iconPlay.style.display = "";
    els.iconPause.style.display = "none";
    updateActive();
  });
  audio.addEventListener("ended", () => {
    if (repeatMode === "one") {
      audio.currentTime = 0;
      audio.play();
      return;
    }
    step(1);
  });
  audio.addEventListener("error", () => {
    if (current < 0) return;
    showNotice(`「${tracks[current].title}」を再生できませんでした。スキップします。`);
    const failed = current;
    tracks[failed].error = "playback failed";
    buildOrder();
    renderPlaylist();
    if (order.length) step(1);
  });
  audio.addEventListener("timeupdate", () => {
    if (seeking) return;
    els.curTime.textContent = fmt(audio.currentTime);
    const p = audio.duration ? (audio.currentTime / audio.duration) * 1000 : 0;
    els.seek.value = p;
    els.seek.style.setProperty("--fill", `${p / 10}%`);
  });
  audio.addEventListener("loadedmetadata", () => {
    els.durTime.textContent = fmt(audio.duration);
    const durEl = document.querySelector(`[data-dur="${current}"]`);
    if (durEl && !durEl.textContent) durEl.textContent = fmt(audio.duration);
  });

  els.seek.addEventListener("input", () => {
    seeking = true;
    els.seek.style.setProperty("--fill", `${els.seek.value / 10}%`);
    els.curTime.textContent = fmt((els.seek.value / 1000) * (audio.duration || 0));
  });
  els.seek.addEventListener("change", () => {
    if (audio.duration) audio.currentTime = (els.seek.value / 1000) * audio.duration;
    seeking = false;
  });
  els.vol.addEventListener("input", () => {
    audio.volume = els.vol.value / 100;
    els.vol.style.setProperty("--fill", `${els.vol.value}%`);
  });
  audio.volume = 0.8;
  els.vol.style.setProperty("--fill", "80%");

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); els.btnPlay.click(); }
    if (e.code === "ArrowRight" && e.shiftKey) step(1);
    if (e.code === "ArrowLeft" && e.shiftKey) step(-1);
  });

  function updateMediaSession(t) {
    if (!("mediaSession" in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title,
      artist: "Suno AI",
      album: "Suno Music Player",
      artwork: t.image ? [{ src: t.image, sizes: "512x512" }] : [],
    });
    navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
    navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
    navigator.mediaSession.setActionHandler("play", () => audio.play());
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  }

  // ===== 初期化 =====
  fetch("playlist.json", { cache: "no-cache" })
    .then((r) => {
      if (!r.ok) throw new Error(`playlist.json: HTTP ${r.status}`);
      return r.json();
    })
    .then((data) => {
      tracks = data.tracks || [];
      buildOrder();
      renderPlaylist();
      if (order.length) {
        playTrack(order[0], false); // 最初の曲をセット（自動再生はしない）
        els.npTitle.textContent = tracks[order[0]].title;
      } else {
        els.npTitle.textContent = "再生できる曲がありません";
        showNotice("playlist.json に再生可能な曲がありません。songs.json を確認してください。");
      }
    })
    .catch((err) => {
      els.npTitle.textContent = "プレイリストを読み込めませんでした";
      showNotice(
        "playlist.json が見つかりません。GitHub Actions の「Update playlist」ワークフローを実行すると生成されます。 (" + err.message + ")"
      );
    });
})();
</script>
</body>
</html>
