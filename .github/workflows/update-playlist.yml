name: Update playlist

on:
  push:
    paths:
      - songs.json
      - audio/**
      - scripts/resolve-playlist.mjs
      - .github/workflows/update-playlist.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-playlist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve Suno links
        run: node scripts/resolve-playlist.mjs

      - name: Commit playlist.json
        run: |
          if [ -z "$(git status --porcelain -- playlist.json)" ]; then
            echo "playlist.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git commit -m "Update playlist.json from songs.json"
          git push
